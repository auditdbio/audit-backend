[package]
name = "fts"
version = "0.1.0"
edition = "2021"

[dependencies]
tantivy = "0.22.0"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
common = { path = "../common" }
tempfile = { version = "3", optional = true }
futures = "0.3"
mongodb = "2.8"
sled = "0.34"
log = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"
testcontainers-modules = { version = "0.11.5", features = ["mongo"] }
env_logger="0.11"
ctor="0.2.9"