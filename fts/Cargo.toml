[package]
name = "fts"
version = "0.1.0"
edition = "2021"

[dependencies]
tantivy = "0.22"
mongodb = { version = "2.8.0", features = ["tokio-runtime"] }
sled = "0.34"
actix-web = "4.9.0"
actix-cors = "0.6.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
async-trait = "0.1"
bson = { version = "2.8.1", features = ["chrono-0_4"] }
